<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devaneios</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- CSS Variables & Theming --- */
      :root {
        --bg-color: #ffffff;
        --text-primary: #18181b;
        --text-secondary: #71717a;
        --text-muted: #a1a1aa;
        --border-color: #f1f5f9;
        --code-bg: #f4f4f5;
        --pre-bg: #09090b;
        --pre-text: #fafafa;
        --pre-border: #27272a;
        --accent: #18181b;
      }

      [data-theme="dark"] {
        --bg-color: #09090b;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #52525b;
        --border-color: #18181b;
        --code-bg: rgba(39, 39, 42, 0.8);
        --pre-bg: #09090b;
        --pre-text: #f4f4f5;
        --pre-border: #27272a;
        --accent: #f4f4f5;
      }

      /* --- Global Reset & Base --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        height: 100%;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100%;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
        -webkit-font-smoothing: antialiased;
      }

      /* --- Theme Toggle Button (Top Right) --- */
      .theme-toggle {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 50;
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 0.5rem;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.2s ease;

        &:hover {
          color: var(--text-primary);
        }

        svg {
          width: 1.25rem;
          height: 1.25rem;
          stroke-width: 1.75;
          fill: none;
          stroke: currentColor;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
      }

      /* --- Layout Container --- */
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 6rem 1.5rem;

        @media (min-width: 768px) {
          padding: 6rem 1.5rem;
        }
      }

      /* --- List View (Forum Style) --- */
      .forum-list {
        border-top: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;

        .forum-item {
          padding: 1rem 0;
          cursor: pointer;
          border-bottom: 1px solid var(--border-color);

          &:last-child {
            border-bottom: none;
          }

          .item-content {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;

            .item-index {
              font-family: monospace;
              font-size: 0.75rem;
              color: var(--text-muted);
              user-select: none;
            }

            .item-details {
              flex: 1;

              .item-title-wrapper {
                display: inline-block;

                .item-title {
                  font-size: 1rem;
                  font-weight: 500;
                  color: var(--text-primary);
                  display: inline-block;
                  position: relative;
                  transition: color 0.2s ease;

                  /* Underline Hover Animation */
                  &::after {
                    content: "";
                    position: absolute;
                    width: 100%;
                    transform: scaleX(0);
                    height: 1.5px;
                    bottom: -1px;
                    left: 0;
                    background-color: currentColor;
                    transform-origin: bottom right;
                    transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
                  }
                }
              }

              .item-meta {
                margin-top: 0.25rem;
                font-family: monospace;
                font-size: 11px;
                color: var(--text-secondary);
                display: flex;
                align-items: center;
                gap: 0.5rem;
              }
            }
          }

          &:hover {
            .item-title::after {
              transform: scaleX(1);
              transform-origin: bottom left;
            }
          }
        }
      }

      /* --- Reader View --- */
      .hidden {
        display: none !important;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-secondary);
        background: transparent;
        border: none;
        cursor: pointer;
        margin-bottom: 2rem;
        transition: color 0.2s ease;

        span {
          transition: transform 0.2s ease;
        }

        &:hover {
          color: var(--text-primary);
          span {
            transform: translateX(-2px);
          }
        }
      }

      .post-meta {
        font-family: monospace;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* --- Loading Spinner --- */
      .loading-state {
        padding: 3rem 0;
        text-align: center;

        .spinner {
          display: inline-block;
          width: 1rem;
          height: 1rem;
          border: 2px solid var(--text-secondary);
          border-top-color: transparent;
          border-radius: 50%;
          animation: spin 0.6s linear infinite;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* --- Markdown Body Custom CSS Nesting Typography --- */
      .markdown-body {
        h1 {
          font-size: 1.5rem;
          font-weight: 700;
          color: var(--text-primary);
          margin-bottom: 1.5rem;
          padding-bottom: 0.75rem;
          border-bottom: 1px solid var(--border-color);
          letter-spacing: -0.025em;

          @media (min-width: 768px) {
            font-size: 1.875rem;
          }
        }

        h2 {
          font-size: 1.25rem;
          font-weight: 600;
          color: var(--text-primary);
          margin-top: 2rem;
          margin-bottom: 1rem;
          letter-spacing: -0.025em;

          @media (min-width: 768px) {
            font-size: 1.5rem;
          }
        }

        h3 {
          font-size: 1.125rem;
          font-weight: 500;
          color: var(--text-primary);
          margin-top: 1.5rem;
          margin-bottom: 0.75rem;
        }

        p {
          color: var(--text-secondary);
          line-height: 1.7;
          margin-bottom: 1.25rem;
          font-size: 1rem;
        }

        ul,
        ol {
          list-style-position: inside;
          margin-bottom: 1.25rem;
          color: var(--text-secondary);
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
        }

        blockquote {
          border-left: 2px solid var(--text-muted);
          padding-left: 1rem;
          font-style: italic;
          color: var(--text-secondary);
          margin: 1.5rem 0;
        }

        code {
          background-color: var(--code-bg);
          color: var(--text-primary);
          padding: 0.2rem 0.4rem;
          border-radius: 0.25rem;
          font-size: 0.75rem;
          font-family: monospace;
        }

        pre {
          background-color: var(--pre-bg);
          color: var(--pre-text);
          padding: 1rem;
          border-radius: 0.5rem;
          overflow-x: auto;
          margin: 1.5rem 0;
          font-family: monospace;
          font-size: 0.75rem;
          border: 1px solid var(--pre-border);

          code {
            background-color: transparent;
            color: inherit;
            padding: 0;
          }
        }

        hr {
          margin: 2rem 0;
          border: none;
          border-top: 1px solid var(--border-color);
        }

        strong {
          font-weight: 600;
          color: var(--text-primary);
        }

        a {
          color: var(--text-primary);
          text-decoration: underline;
          text-decoration-color: var(--text-muted);
          transition: text-decoration-color 0.2s ease;

          &:hover {
            text-decoration-color: var(--text-primary);
          }
        }
      }
    </style>
  </head>

  <body>
    <!-- Theme Toggle Button -->
    <button
      id="themeToggleBtn"
      onclick="toggleTheme()"
      class="theme-toggle"
      aria-label="Alternar Tema"
    >
      <!-- Sun Icon -->
      <svg id="sunIcon" viewBox="0 0 24 24" style="display: none">
        <path
          d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
        ></path>
      </svg>
      <!-- Moon Icon -->
      <svg id="moonIcon" viewBox="0 0 24 24">
        <path
          d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
        ></path>
      </svg>
    </button>

    <!-- Main Container -->
    <main>
      <!-- SECTION 1: FORUM LIST VIEW -->
      <section id="listView">
        <div id="forumPostsList" class="forum-list">
          <!-- Posts dynamic injection -->
        </div>
      </section>

      <!-- SECTION 2: ARTICLE READER -->
      <section id="readerView" class="hidden">
        <button onclick="voltarParaLista()" class="back-button">
          <span>←</span> Voltar para a lista
        </button>

        <article>
          <div id="postMeta" class="post-meta">
            <span id="postAuthor">r/markdown</span>
            <span>•</span>
            <span id="postPath"></span>
          </div>

          <div id="loadingState" class="loading-state hidden">
            <div class="spinner"></div>
          </div>

          <div id="markdownContent" class="markdown-body">
            <!-- Rendered Markdown output -->
          </div>
        </article>
      </section>
    </main>

    <script>
      // Array de dados solicitado
      const text = [
        { name: "A Cidade", access: "a-cidade" },
        { name: "Post Human", access: "post-human" },
        { name: "Nascer, viver, morrer.", access: "nascer-viver-morrer" },
        { name: "Decomposição", access: "decomposicao" },
        { name: "Memórias", access: "memorias" },
        { name: "Jásmim e o Lírio", access: "jasmim-e-o-lirio" },
      ];

      document.addEventListener("DOMContentLoaded", () => {
        initTheme();
        renderList();

        const hash = window.location.hash.replace("#", "");
        if (hash) {
          abrirTexto(hash);
        }
      });

      // Gerenciamento de Tema
      function toggleTheme() {
        const currentTheme =
          document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("forum_theme", newTheme);
        updateThemeIcons(newTheme === "dark");
      }

      function initTheme() {
        const savedTheme = localStorage.getItem("forum_theme");
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        const isDark = savedTheme ? savedTheme === "dark" : prefersDark;

        if (isDark) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
        updateThemeIcons(isDark);
      }

      function updateThemeIcons(isDark) {
        document.getElementById("sunIcon").style.display = isDark
          ? "block"
          : "none";
        document.getElementById("moonIcon").style.display = isDark
          ? "none"
          : "block";
      }

      // Renderização da Lista Estilo Fórum
      function renderList() {
        const container = document.getElementById("forumPostsList");
        container.innerHTML = "";

        text.forEach((item, index) => {
          const idxStr = String(index + 1).padStart(2, "0");
          const row = document.createElement("div");
          row.className = "forum-item";
          row.onclick = () => abrirTexto(item.access);

          row.innerHTML = `
            <div class="item-content">
              <span class="item-index">${idxStr}.</span>
              <div class="item-details">
                <div class="item-title-wrapper">
                  <h2 class="item-title">${item.name}</h2>
                </div>
                <div class="item-meta">
                  <span>•</span>
                  <span>text/${item.access}.md</span>
                </div>
              </div>
            </div>
          `;
          container.appendChild(row);
        });
      }

      // Abrir e Carregar o Texto .md
      async function abrirTexto(access) {
        window.location.hash = access;

        document.getElementById("listView").classList.add("hidden");
        document.getElementById("readerView").classList.remove("hidden");

        const contentEl = document.getElementById("markdownContent");
        const loadingEl = document.getElementById("loadingState");
        const pathEl = document.getElementById("postPath");

        pathEl.innerText = `text/${access}.md`;
        contentEl.innerHTML = "";
        loadingEl.classList.remove("hidden");

        let markdownRaw = "";

        try {
          const res = await fetch(`./text/${access}.md`);
          if (!res.ok) throw new Error("Arquivo não encontrado");
          markdownRaw = await res.text();
        } catch (err) {
          await new Promise((resolve) => setTimeout(resolve, 150));
          markdownRaw =
            fallbacks[access] ||
            `# ${access}\n\nTexto não localizado na pasta \`text/\`.`;
        }

        loadingEl.classList.add("hidden");
        contentEl.innerHTML = marked.parse(markdownRaw);

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Voltar para a lista principal
      function voltarParaLista() {
        window.location.hash = "";
        document.getElementById("readerView").classList.add("hidden");
        document.getElementById("listView").classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
  </body>
</html>
